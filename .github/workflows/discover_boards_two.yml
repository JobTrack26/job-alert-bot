name: Discover Boards Two

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python discover_boards_two.py
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add boards_two.json
          git diff --staged --quiet || git commit -m "Update boards_two.json"
          git push
