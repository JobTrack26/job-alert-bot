name: Daily ATS Board Discovery

on:
  schedule:
    - cron: "0 2 * * *" # 7:30 AM IST daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: python discover_boards.py
      - name: Commit updated boards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add boards.json discover_state.json
          git diff --staged --quiet || (git commit -m "Update discovered ATS boards" && git push)
